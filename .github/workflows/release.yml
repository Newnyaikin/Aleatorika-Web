name: Web - release ZIP
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/prepare_site.py
      - name: Package web and source
        shell: bash
        run: |
          mkdir -p dist
          (cd _site && zip -qr ../dist/Aleatorika-1.0-web.zip .)
          git archive --format=zip --prefix=Aleatorika-Web/ -o dist/Aleatorika-Web-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Aleatorika-Web-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aleatorika-Web-release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Алеаторика Web $TAG" --notes 'Статическая веб-версия и исходники. Для микрофона нужен HTTPS или localhost.'
          fi
          gh release upload "$TAG" dist/*.zip --clobber
